name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx ajv-cli validate -s packages/contracts/mcp-tools.json -d packages/contracts/mcp-tools.json --spec=draft2020
      - run: 'sqlite3 :memory: < packages/contracts/schema.sql'
      - run: cmp packages/contracts/schema.sql sidecar/src/kernel/migrations/0001.sql

  sidecar:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bun run typecheck
      - run: bun test

  rust:
    runs-on: macos-14
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo deny check

  ui:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.base.json
      - run: bun --cwd ui build

  license-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx license-checker --production --summary
