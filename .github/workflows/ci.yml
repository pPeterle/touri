name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx ajv-cli validate -s packages/contracts/mcp-tools.json -d packages/contracts/mcp-tools.json --spec=draft2020
      - run: 'sqlite3 :memory: < packages/contracts/schema.sql'
      - run: cmp packages/contracts/schema.sql sidecar/src/kernel/migrations/0001.sql

  sidecar:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bun run typecheck
      - run: bun test

  rust:
    runs-on: macos-14
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo deny check

  ui:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.base.json
      - run: bun --cwd ui build

  license-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bunx license-checker --production --summary

  linux:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils unzip gnome-keyring dbus
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test --timeout 30000 sidecar/test
      - run: bun --cwd ui test --maxWorkers=2 --minWorkers=1 --testTimeout=30000
      - run: bun run build:sidecar:linux
      - run: dbus-run-session -- bash scripts/test-native-linux.sh
      - run: bun run test:sidecar:smoke
      - run: bunx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: touri-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      TOURI_VM_INTEGRATION: "0"
      TOURI_E2E_REAL_CLI: "0"
      TOURI_OPENCODE_REAL: "0"
      TOURI_DOCTOR_SKIP_PROVIDER_PROBES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build:sidecar:windows
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: bun run test:sidecar:portable
      - run: bun --cwd ui test --maxWorkers=2 --minWorkers=1 --testTimeout=30000
      - run: bun run test:sidecar:smoke
      - run: bun run tauri build --bundles "msi,nsis"
      - uses: actions/upload-artifact@v4
        with:
          name: touri-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/binaries/touri-sidecar-x86_64-pc-windows-msvc.exe
