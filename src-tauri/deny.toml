# Keep license acceptance explicit. These are the licenses in the desktop tree;
# unknown licenses and security vulnerabilities remain errors.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
# GTK's glib-macros 0.18 still uses proc-macro-error 1; upstream has no safe
# upgrade. This is an unmaintained build-time macro, not a vulnerability waiver.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "Transitive glib-macros dependency; no safe upstream upgrade is available." },
]
